<svg xmlns="http://www.w3.org/2000/svg" width="340" height="210" viewBox="0 0 340 210" role="img" aria-label="Tourist pass badge">
  <defs>
    <clipPath id="tb-tag"><rect x="8" y="8" width="324" height="194" rx="24"/></clipPath>
    <linearGradient id="tb-band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="324" height="194" rx="24" fill="#fff7ed"/>
  <g clip-path="url(#tb-tag)">
    <rect x="8" y="8" width="324" height="84" fill="url(#tb-band)"/>
    <rect x="8" y="88" width="324" height="5" fill="#22d3ee"/>
  </g>
  <rect x="8" y="8" width="324" height="194" rx="24" fill="none" stroke="#0f172a" stroke-width="4"/>
  <!-- punch hole -->
  <circle cx="44" cy="50" r="13" fill="#0f172a"/>
  <circle cx="44" cy="50" r="7" fill="#fff7ed"/>
  <text x="190" y="66" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="46" letter-spacing="3" fill="#ffffff">TOURIST</text>
  <!-- I (heart) VICE CITY -->
  <text x="34" y="138" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="40" fill="#0f172a">I</text>
  <path d="M84,128 C76,116 60,118 60,131 C60,142 74,150 84,160 C94,150 108,142 108,131 C108,118 92,116 84,128 Z" fill="#ec4899" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/>
  <text x="120" y="138" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="32" fill="#0f172a" textLength="196" lengthAdjust="spacingAndGlyphs">VICE CITY</text>
  <!-- barcode + small print -->
  <g fill="#0f172a">
    <rect x="30" y="168" width="4" height="22"/><rect x="38" y="168" width="2" height="22"/><rect x="44" y="168" width="6" height="22"/>
    <rect x="54" y="168" width="2" height="22"/><rect x="60" y="168" width="4" height="22"/><rect x="68" y="168" width="2" height="22"/>
    <rect x="74" y="168" width="6" height="22"/><rect x="84" y="168" width="2" height="22"/><rect x="90" y="168" width="4" height="22"/>
  </g>
  <text x="310" y="184" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="13" letter-spacing="3" fill="#0f172a">ALL-ACCESS PASS</text>
  <text x="310" y="200" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="10" letter-spacing="2" fill="#475569">VALID FOREVER · 1986</text>
</svg>
