<svg xmlns="http://www.w3.org/2000/svg" width="360" height="150" viewBox="0 0 360 150" role="img" aria-label="Neon Dream neon sign badge">
  <defs>
    <filter id="nb-glow" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nb-soft" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="12" y="12" width="336" height="126" rx="30" fill="#050816" fill-opacity="0.78"/>
  <rect x="12" y="12" width="336" height="126" rx="30" fill="none" stroke="#22d3ee" stroke-width="5" filter="url(#nb-glow)"/>
  <rect x="26" y="26" width="308" height="98" rx="22" fill="none" stroke="#ff4fa3" stroke-width="2.6" filter="url(#nb-soft)"/>
  <text x="180" y="82" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="50" letter-spacing="4" fill="#ffe0f2" stroke="#ff4fa3" stroke-width="1.6" filter="url(#nb-glow)">NEON</text>
  <text x="180" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="16" letter-spacing="6.5" fill="#a5f3fc" filter="url(#nb-soft)">DREAM · VICE CITY</text>
  <!-- bolts -->
  <path d="M46,50 l-10,20 h9 l-5,18 14,-24 h-9 z" fill="#fde047" filter="url(#nb-soft)"/>
  <path d="M314,50 l-10,20 h9 l-5,18 14,-24 h-9 z" fill="#fde047" filter="url(#nb-soft)"/>
</svg>
